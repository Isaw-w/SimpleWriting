<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="editor.bundle.css">
  <style>
    :root {
      --bg: #fbfaf7; --fg: #26231e; --muted: #a19b90; --faint: rgba(120,110,95,0.14);
      --link: #b6552a; --sel: rgba(182,85,42,0.16); --tblborder: rgba(120,110,95,0.30);
    }
    body.dark {
      --bg: #17181a; --fg: #e7e4dd; --muted: #7c7a74; --faint: rgba(255,255,255,0.10);
      --link: #e0956a; --sel: rgba(224,149,106,0.20); --tblborder: rgba(255,255,255,0.20);
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    * { -webkit-user-select: text; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    ::selection { background: var(--sel); }

    #editor {
      max-width: 680px; margin: 0 auto; padding: 9vh 28px 40vh;
      color: var(--fg);
      font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
      font-size: 21px; line-height: 1.75; letter-spacing: 0.005em;
      font-feature-settings: "liga" 1, "kern" 1;
      -webkit-font-smoothing: antialiased;
      animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .ProseMirror { outline: none; min-height: 50vh; caret-color: var(--link); }
    .ProseMirror p { margin: 0 0 0.9em; }
    .ProseMirror h1, .ProseMirror h2, .ProseMirror h3 {
      font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; margin: 1.5em 0 0.4em;
    }
    .ProseMirror h1 { font-size: 1.72em; }
    .ProseMirror h2 { font-size: 1.38em; }
    .ProseMirror h3 { font-size: 1.16em; }
    .ProseMirror > :first-child { margin-top: 0; }
    .ProseMirror a { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 45%, transparent); cursor: text; transition: border-color .2s; }
    .ProseMirror a:hover { border-bottom-color: var(--link); }
    .ProseMirror blockquote {
      border-left: 2px solid var(--muted); margin: 0 0 0.9em; padding-left: 1em;
      color: var(--muted); font-style: italic;
    }
    .ProseMirror code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85em; background: var(--faint); padding: 0.08em 0.34em; border-radius: 5px;
    }
    .ProseMirror pre {
      background: var(--faint); padding: 0.8em 1em; border-radius: 10px; overflow-x: auto;
      font-size: 0.85em; line-height: 1.5;
    }
    .ProseMirror hr { border: none; height: 1px; background: var(--faint); margin: 1.6em 0; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 1.3em; }
    .ProseMirror li { margin: 0.2em 0; }

    /* Quiet placeholder on an empty document. */
    .ProseMirror .is-empty::before {
      content: attr(data-placeholder); color: var(--muted);
      font-style: italic; pointer-events: none; position: absolute;
    }

    /* Task checkboxes. Quiet outline until touched; the checked state shows as
       fill + strikethrough (not motion alone), with a checkmark that grows in
       on one confident ease. */
    .ProseMirror li.task-item { list-style: none; display: flex; align-items: flex-start; gap: 0.55em; }
    .ProseMirror li.task-item > .task-checkbox {
      flex: 0 0 auto; width: 1.05em; height: 1.05em; margin-top: 0.3em;
      border: 1.5px solid var(--muted); border-radius: 0.3em; background: transparent;
      cursor: pointer; position: relative; user-select: none;
      transition: background-color .18s ease, border-color .18s ease;
    }
    .ProseMirror li.task-item > .task-checkbox:hover { border-color: var(--link); }
    .ProseMirror li.task-item[data-checked="true"] > .task-checkbox {
      background: var(--link); border-color: var(--link);
    }
    .ProseMirror li.task-item > .task-checkbox::after {
      content: ""; position: absolute; left: 0.35em; top: 0.14em;
      width: 0.26em; height: 0.52em; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0); transform-origin: 55% 55%;
      transition: transform .18s cubic-bezier(.2,.85,.3,1.1);
    }
    .ProseMirror li.task-item[data-checked="true"] > .task-checkbox::after { transform: rotate(45deg) scale(1); }
    .ProseMirror li.task-item > .li-content { flex: 1 1 auto; min-width: 0; transition: color .22s ease; }
    .ProseMirror li.task-item[data-checked="true"] > .li-content { color: var(--muted); }
    .ProseMirror li.task-item[data-checked="true"] > .li-content p { text-decoration: line-through; }
    @media (prefers-reduced-motion: reduce) {
      .ProseMirror li.task-item > .task-checkbox,
      .ProseMirror li.task-item > .task-checkbox::after,
      .ProseMirror li.task-item > .li-content { transition: none; }
    }

    /* GFM tables. */
    .ProseMirror table {
      border-collapse: collapse; table-layout: fixed; width: 100%;
      margin: 0 0 0.9em; overflow: hidden;
    }
    .ProseMirror td, .ProseMirror th {
      border: 1px solid var(--tblborder); padding: 6px 10px; box-sizing: border-box;
      vertical-align: top; text-align: left; min-width: 2em; position: relative;
    }
    .ProseMirror th { font-weight: 700; background: var(--faint); }
    .ProseMirror .selectedCell:after {
      content: ""; position: absolute; inset: 0; background: var(--sel); pointer-events: none;
    }

    /* Soft, rounded highlight fills (colour comes inline from Swift). */
    .hl {
      border-radius: 4px; padding: 0.04em 0.05em;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      transition: background-color .18s ease;
    }

    .hl-tip {
      position: absolute; z-index: 50; max-width: 320px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--faint); border-radius: 12px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.18);
      padding: 11px 14px; font-family: -apple-system, system-ui, sans-serif;
      animation: rise 0.18s ease both;
    }
    .hl-tip-title { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.01em; }
    .hl-tip-hint { font-size: 14px; line-height: 1.45; }

    /* PDF export goes through the print path: plain black-on-white, page
       margins supplied by the print job, and no grammar highlights or tooltips
       baked into the document. Inline decoration styles are overridden here. */
    @media print {
      html, body { background: #fff !important; height: auto; }
      #editor {
        max-width: none; margin: 0; padding: 0;
        color: #000 !important; font-size: 12pt; line-height: 1.55;
        animation: none;
      }
      .ProseMirror { min-height: 0; }
      .ProseMirror a { color: #000 !important; border-bottom: none !important; }
      .hl {
        background: transparent !important; padding: 0 !important;
        text-decoration: none !important; border: 0 !important; box-shadow: none !important;
      }
      .hl-tip { display: none !important; }
      .ProseMirror .is-empty::before { content: none !important; }
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.bundle.js"></script>
</body>
</html>
